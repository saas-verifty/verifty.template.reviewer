name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  email-validation:
    name: Validate Corporate Email
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit emails
        run: |
          CORPORATE_DOMAIN="verifty.com"
          INVALID_COMMITS=""

          # Get all commits in PR or push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H %ae" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            COMMITS=$(git log --format="%H %ae" -1)
          fi

          while IFS= read -r line; do
            COMMIT_HASH=$(echo "$line" | awk '{print $1}')
            COMMIT_EMAIL=$(echo "$line" | awk '{print $2}')

            if [[ ! "$COMMIT_EMAIL" =~ @${CORPORATE_DOMAIN}$ ]]; then
              INVALID_COMMITS="${INVALID_COMMITS}\n  - ${COMMIT_HASH}: ${COMMIT_EMAIL}"
            fi
          done <<< "$COMMITS"

          if [ ! -z "$INVALID_COMMITS" ]; then
            echo "Error: The following commits use non-corporate emails:"
            echo -e "$INVALID_COMMITS"
            echo ""
            echo "All commits must use @${CORPORATE_DOMAIN} email addresses"
            exit 1
          fi

          echo "All commit emails validated successfully"

  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    needs: email-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
